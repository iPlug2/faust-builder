name: Build and Release LibFaust

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub release'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build:
    runs-on: macos-26  # Apple Silicon runner with current visionOS SDK support

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Verify Apple platform SDKs
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphonesimulator --show-sdk-path
          xcrun --sdk xros --show-sdk-path
          xcrun --sdk xrsimulator --show-sdk-path
          xcrun --sdk macosx --show-sdk-path

      - name: Build LibFaust XCFramework
        run: python3 build.py

      # build.py's run_command() prints errors but does not raise, so a failed
      # cmake configure/build can leave a partial XCFramework behind. Assert the
      # shape of the output rather than trusting the exit code.
      - name: Verify XCFramework slices
        run: |
          set -euo pipefail
          XCF=build/LibFaust.xcframework

          fail=0

          # slice dir : library name : expected LC_BUILD_VERSION platform : expected archs
          while IFS=: read -r slice lib want_platform want_archs_csv; do
            [ -n "$slice" ] || continue
            want_archs=$(echo "$want_archs_csv" | tr ',' '\n' | sort | tr '\n' ' ')

            path="$XCF/$slice/$lib"
            if [ ! -f "$path" ]; then
              echo "::error::missing slice $slice/$lib"
              fail=1
              continue
            fi

            bad=0
            got_archs=$(lipo -archs "$path" | tr ' ' '\n' | sort | tr '\n' ' ')
            if [ "$got_archs" != "$want_archs" ]; then
              echo "::error::$slice archs: want [$want_archs] got [$got_archs]"
              bad=1
            fi

            # Every object in the archive must target the expected platform, so a
            # slice silently built against the wrong SDK does not ship.
            got_platforms=$(otool -l "$path" \
              | grep -A4 LC_BUILD_VERSION \
              | awk '/ platform / {print $2}' \
              | sort -u | tr '\n' ' ' | sed 's/ $//')
            if [ "$got_platforms" != "$want_platform" ]; then
              echo "::error::$slice platform: want [$want_platform] got [$got_platforms]"
              bad=1
            fi

            if [ "$bad" -eq 0 ]; then
              echo "ok: $slice ($got_archs platform $got_platforms)"
            else
              fail=1
            fi
          done <<'SLICES'
          ios-arm64:ios_libfaust.a:2:arm64
          ios-arm64-simulator:ios_sim_libfaust.a:7:arm64
          xros-arm64:xros_libfaust.a:11:arm64
          xros-arm64-simulator:xros_sim_libfaust.a:12:arm64
          macos-arm64_x86_64:macos_libfaust.a:1:arm64,x86_64
          SLICES

          # Public headers are hand-enumerated in build.py and only warn when absent.
          header_count=$(find build/headers -type f | wc -l | tr -d ' ')
          echo "headers: $header_count file(s)"
          if [ "$header_count" -eq 0 ]; then
            echo "::error::no headers were emitted to build/headers"
            fail=1
          fi

          codesign -v "$XCF"
          exit $fail

      - name: Package XCFramework
        run: |
          cd build
          # Create XCFramework zip
          zip -r LibFaust.xcframework.zip LibFaust.xcframework
          # Create headers tarball
          tar -czf libfaust-headers.tar.gz headers/
          # List artifacts
          ls -la *.zip *.tar.gz

      - name: Upload XCFramework artifact
        uses: actions/upload-artifact@v4
        with:
          name: LibFaust.xcframework
          path: build/LibFaust.xcframework.zip
          retention-days: 30

      - name: Upload Headers artifact
        uses: actions/upload-artifact@v4
        with:
          name: libfaust-headers
          path: build/libfaust-headers.tar.gz
          retention-days: 30

      - name: Get Faust version
        id: faust_version
        run: |
          FAUST_VERSION=$(grep "set (VERSION" faust/build/CMakeLists.txt | sed 's/.*VERSION \([0-9.]*\).*/\1/')
          echo "version=${FAUST_VERSION}" >> $GITHUB_OUTPUT
          echo "Faust version: ${FAUST_VERSION}"

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/LibFaust.xcframework.zip
            build/libfaust-headers.tar.gz
          body: |
            ## LibFaust XCFramework

            Pre-built libfaust static library for Apple platforms.

            **Faust Compiler Version:** ${{ steps.faust_version.outputs.version }}

            ### Platforms Included

            | Slice | Architectures | Minimum OS |
            |---|---|---|
            | `macos-arm64_x86_64` | arm64 + x86_64 (universal) | macOS 11.0 |
            | `ios-arm64` | arm64 | iOS 15.0 |
            | `ios-arm64-simulator` | arm64 | iOS 15.0 |
            | `xros-arm64` | arm64 | visionOS 1.0 |
            | `xros-arm64-simulator` | arm64 | visionOS 1.0 |

            ### Backends Enabled
            - C++ backend
            - Interpreter backend (static)

            ### Usage

            Two separate downloads — the XCFramework carries no headers.

            - **Headers:** extract `libfaust-headers.tar.gz` and add the
              resulting `headers/` directory to your include path.
            - **Library:** extract `LibFaust.xcframework.zip`. Each slice uses a
              distinct library basename (required by `xcodebuild
              -create-xcframework`), e.g.
              `LibFaust.xcframework/ios-arm64/ios_libfaust.a`. Link the
              `.xcframework` itself and let Xcode select the slice.
          draft: false
          generate_release_notes: true
          tag_name: ${{ github.ref_name || format('v{0}', github.run_number) }}
