name: Build and Release LibFaust

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub release'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build-apple:
    runs-on: macos-26  # Apple Silicon runner with current visionOS SDK support
    outputs:
      faust_version: ${{ steps.faust_version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      # faust/libraries (the Faust standard libraries, shipped as faust-libraries.tar.gz) is a submodule of the
      # faust submodule. Only check out that one, not faust's other nested submodules
      - name: Check out the Faust libraries
        run: git -C faust submodule update --init libraries

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Verify Apple platform SDKs
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphonesimulator --show-sdk-path
          xcrun --sdk xros --show-sdk-path
          xcrun --sdk xrsimulator --show-sdk-path
          xcrun --sdk macosx --show-sdk-path

      - name: Build LibFaust XCFramework
        run: python3 build.py

      # build.py's run_command() prints errors but does not raise, so a failed
      # cmake configure/build can leave a partial XCFramework behind. Assert the
      # shape of the output rather than trusting the exit code.
      - name: Verify XCFramework slices
        run: |
          set -euo pipefail
          XCF=build/LibFaust.xcframework

          fail=0

          # slice dir : library name : expected LC_BUILD_VERSION platform : expected archs
          while IFS=: read -r slice lib want_platform want_archs_csv; do
            [ -n "$slice" ] || continue
            want_archs=$(echo "$want_archs_csv" | tr ',' '\n' | sort | tr '\n' ' ')

            path="$XCF/$slice/$lib"
            if [ ! -f "$path" ]; then
              echo "::error::missing slice $slice/$lib"
              fail=1
              continue
            fi

            bad=0
            got_archs=$(lipo -archs "$path" | tr ' ' '\n' | sort | tr '\n' ' ')
            if [ "$got_archs" != "$want_archs" ]; then
              echo "::error::$slice archs: want [$want_archs] got [$got_archs]"
              bad=1
            fi

            # Every object in the archive must target the expected platform, so a
            # slice silently built against the wrong SDK does not ship.
            got_platforms=$(otool -l "$path" \
              | grep -A4 LC_BUILD_VERSION \
              | awk '/ platform / {print $2}' \
              | sort -u | tr '\n' ' ' | sed 's/ $//')
            if [ "$got_platforms" != "$want_platform" ]; then
              echo "::error::$slice platform: want [$want_platform] got [$got_platforms]"
              bad=1
            fi

            if [ "$bad" -eq 0 ]; then
              echo "ok: $slice ($got_archs platform $got_platforms)"
            else
              fail=1
            fi
          done <<'SLICES'
          ios-arm64:ios_libfaust.a:2:arm64
          ios-arm64-simulator:ios_sim_libfaust.a:7:arm64
          xros-arm64:xros_libfaust.a:11:arm64
          xros-arm64-simulator:xros_sim_libfaust.a:12:arm64
          macos-arm64_x86_64:macos_libfaust.a:1:arm64,x86_64
          SLICES

          # Public headers are hand-enumerated in build.py and only warn when absent.
          header_count=$(find build/headers -type f | wc -l | tr -d ' ')
          echo "headers: $header_count file(s)"
          if [ "$header_count" -eq 0 ]; then
            echo "::error::no headers were emitted to build/headers"
            fail=1
          fi

          # Faust standard libraries, needed by the interpreter at runtime
          if [ ! -f build/libraries/faust/stdfaust.lib ]; then
            echo "::error::Faust libraries missing from build/libraries/faust"
            fail=1
          else
            echo "libraries: $(find build/libraries/faust -name '*.lib' | wc -l | tr -d ' ') .lib file(s)"
          fi

          codesign -v "$XCF"
          exit $fail

      - name: Package XCFramework
        run: |
          cd build
          # Create XCFramework zip
          zip -r LibFaust.xcframework.zip LibFaust.xcframework
          # Create headers tarball
          tar -czf libfaust-headers.tar.gz headers/
          # Create Faust libraries tarball (extracts to faust/, like share/faust in an installation)
          tar -czf faust-libraries.tar.gz -C libraries faust
          # List artifacts
          ls -la *.zip *.tar.gz

      - name: Upload XCFramework artifact
        uses: actions/upload-artifact@v4
        with:
          name: LibFaust.xcframework
          path: build/LibFaust.xcframework.zip
          retention-days: 30

      - name: Upload Headers artifact
        uses: actions/upload-artifact@v4
        with:
          name: libfaust-headers
          path: build/libfaust-headers.tar.gz
          retention-days: 30

      - name: Upload Faust libraries artifact
        uses: actions/upload-artifact@v4
        with:
          name: faust-libraries
          path: build/faust-libraries.tar.gz
          retention-days: 30

      - name: Get Faust version
        id: faust_version
        run: |
          FAUST_VERSION=$(grep "set (VERSION" faust/build/CMakeLists.txt | sed 's/.*VERSION \([0-9.]*\).*/\1/')
          echo "version=${FAUST_VERSION}" >> $GITHUB_OUTPUT
          echo "Faust version: ${FAUST_VERSION}"

  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Check out the Faust libraries
        run: git -C faust submodule update --init libraries

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build libfaust for Windows
        run: python build.py

      # Check each library's architecture and C runtime (libfaust.lib: /MT, libfaustd.lib: /MTd), and that
      # faust.exe runs and finds the Faust libraries
      - name: Verify libraries and faust.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = (Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1).FullName
          $fail = $false

          $machines = @{ "x64" = "8664 machine \(x64\)"; "ARM64" = "AA64 machine \(ARM64\)"; "ARM64EC" = "A641 machine \(ARM64EC\)" }
          $runtimes = @{ "libfaust.lib" = "LIBCMT"; "libfaustd.lib" = "LIBCMTD" }

          foreach ($arch in $machines.Keys) {
            foreach ($lib in $runtimes.Keys) {
              $path = "build/windows/lib/$arch/$lib"
              if (-not (Test-Path $path)) { Write-Output "::error::missing $path"; $fail = $true; continue }

              $headers = & $dumpbin /headers $path | Out-String
              $directives = & $dumpbin /directives $path | Out-String
              $wantRuntime = $runtimes[$lib]
              $gotRuntimes = [regex]::Matches($directives, "/DEFAULTLIB:`"?(LIBCMTD?)`"?", "IgnoreCase") | ForEach-Object { $_.Groups[1].Value.ToUpper() } | Sort-Object -Unique

              if ($headers -notmatch $machines[$arch]) { Write-Output "::error::$path is not $arch"; $fail = $true }
              elseif ("$gotRuntimes" -ne $wantRuntime) { Write-Output "::error::$path runtime: want $wantRuntime got $gotRuntimes"; $fail = $true }
              else { Write-Output "ok: $path ($arch, $wantRuntime, $([math]::Round((Get-Item $path).Length / 1MB)) MB)" }
            }
          }

          New-Item -ItemType Directory -Force test | Out-Null
          Set-Content -Path test/test.dsp -Value 'import("stdfaust.lib"); process = fi.lowpass(2, 1000);'
          & build/windows/bin/faust.exe --version
          & build/windows/bin/faust.exe -I build/libraries/faust -lang cpp -o test/test.cpp test/test.dsp
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::faust.exe failed to compile test.dsp"; $fail = $true }

          if ($fail) { exit 1 }

      - name: Package Windows libraries
        shell: bash
        run: |
          # Extracts to windows/lib/<arch>/libfaust(d).lib and windows/bin/faust.exe
          tar -czf build/libfaust-windows.tar.gz -C build windows
          ls -la build/*.tar.gz

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: libfaust-windows
          path: build/libfaust-windows.tar.gz
          retention-days: 30

  # One job per architecture, each builds natively on the oldest available Ubuntu, so that the faust executable runs
  # on older distributions (glibc) too. The release job merges both into libfaust-linux.tar.gz
  build-linux:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Check out the Faust libraries
        run: git -C faust submodule update --init libraries

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Build libfaust for Linux
        run: python3 build.py

      # Check the architecture, that libfaust.a is position independent (it is linked into plug-ins), that it links
      # and compiles a DSP with the interpreter, and that the faust executable runs and finds the Faust libraries
      - name: Verify library and faust executable
        run: |
          set -euo pipefail
          ARCH=${{ matrix.arch }}
          LIB=build/linux/lib/$ARCH/libfaust.a
          FAUST=build/linux/bin/$ARCH/faust
          test -f "$LIB" && test -x "$FAUST"
          [ "$(uname -m)" = "$ARCH" ]
          ls -la "$LIB" "$FAUST"

          mkdir -p test
          printf 'import("stdfaust.lib"); process = fi.lowpass(2, 1000);\n' > test/test.dsp
          "$FAUST" --version
          "$FAUST" -I build/libraries/faust -lang cpp -o test/test.cpp test/test.dsp
          # It must not need the build machine's libstdc++
          if ldd "$FAUST" | grep -q 'libstdc++'; then echo "::error::faust links libstdc++ dynamically"; exit 1; fi

          cat > test/test.cpp <<'CPP'
          #include <iostream>
          #include <string>
          #include "faust/dsp/interpreter-dsp.h"
          int main(int argc, char** argv)
          {
            const char* args[] = {"-I", argv[1]};
            std::string error;
            auto* factory = createInterpreterDSPFactoryFromString("test", "import(\"stdfaust.lib\"); process = fi.lowpass(2, 1000);", 2, args, error);
            if (!factory) { std::cerr << error << std::endl; return 1; }
            dsp* d = factory->createDSPInstance();
            d->init(44100);
            std::cout << d->getNumInputs() << " in, " << d->getNumOutputs() << " out" << std::endl;
            delete d;
            deleteInterpreterDSPFactory(factory);
            return 0;
          }
          CPP
          # Linked into a shared library first, which fails if libfaust.a isn't position independent
          echo 'void test() {}' > test/empty.cpp
          g++ -shared -fPIC -o test/libtest.so test/empty.cpp -Wl,--whole-archive "$LIB" -Wl,--no-whole-archive
          g++ -std=c++17 -Ibuild/headers -o test/test test/test.cpp "$LIB" -lpthread -ldl
          ./test/test build/libraries/faust

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: libfaust-linux-${{ matrix.arch }}
          path: build/linux
          retention-days: 30

  release:
    needs: [build-apple, build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # The Linux artifacts of both architectures were merged into artifacts/lib/<arch> and artifacts/bin/<arch>.
      # Package them as linux/lib/<arch>/libfaust.a and linux/bin/<arch>/faust
      - name: Package Linux libraries
        run: |
          mkdir linux
          mv artifacts/lib artifacts/bin linux/
          test -f linux/lib/x86_64/libfaust.a && test -f linux/lib/aarch64/libfaust.a
          chmod +x linux/bin/*/faust   # artifacts don't keep file permissions
          tar -czf artifacts/libfaust-linux.tar.gz linux

      - name: List artifacts
        run: ls -la artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/LibFaust.xcframework.zip
            artifacts/libfaust-windows.tar.gz
            artifacts/libfaust-linux.tar.gz
            artifacts/libfaust-headers.tar.gz
            artifacts/faust-libraries.tar.gz
          body: |
            ## LibFaust

            Pre-built libfaust static libraries for Apple platforms, Windows and Linux.

            **Faust Compiler Version:** ${{ needs.build-apple.outputs.faust_version }}

            ### Platforms Included

            | Slice | Architectures | Minimum OS |
            |---|---|---|
            | `macos-arm64_x86_64` | arm64 + x86_64 (universal) | macOS 11.0 |
            | `ios-arm64` | arm64 | iOS 15.0 |
            | `ios-arm64-simulator` | arm64 | iOS 15.0 |
            | `xros-arm64` | arm64 | visionOS 1.0 |
            | `xros-arm64-simulator` | arm64 | visionOS 1.0 |
            | `windows/lib/<arch>` | x64, ARM64, ARM64EC | Windows, MSVC (VS2022) static runtime |
            | `linux/lib/<arch>` | x86_64, aarch64 | Linux, built on Ubuntu 22.04 (GCC 11, glibc 2.35) |

            ### Backends Enabled
            - Interpreter backend (static)
            - C++ backend in the Windows `faust.exe` and the Linux `faust` executables

            ### Usage

            Headers and Faust libraries are separate downloads, shared by all platforms.

            - **Headers:** extract `libfaust-headers.tar.gz` and add the
              resulting `headers/` directory to your include path.
            - **Apple:** extract `LibFaust.xcframework.zip`. Each slice uses a
              distinct library basename (required by `xcodebuild
              -create-xcframework`), e.g.
              `LibFaust.xcframework/ios-arm64/ios_libfaust.a`. Link the
              `.xcframework` itself and let Xcode select the slice.
            - **Windows:** extract `libfaust-windows.tar.gz` to get
              `windows/lib/<arch>/libfaust.lib` (`/MT`) and `libfaustd.lib`
              (`/MTd`, for Debug builds) for x64, ARM64 and ARM64EC, and
              `windows/bin/faust.exe` (x64, C++ backend). Also link `Ws2_32.lib`.
            - **Linux:** extract `libfaust-linux.tar.gz` to get
              `linux/lib/<arch>/libfaust.a` (position independent) and
              `linux/bin/<arch>/faust` (C++ backend) for x86_64 and aarch64.
            - **Faust libraries:** extract `faust-libraries.tar.gz` to get a
              `faust/` folder with `stdfaust.lib` etc., matching this libfaust
              version. Pass its path to the compiler with `-I` (the interpreter
              needs it at runtime to compile DSP code that imports libraries).
          draft: false
          generate_release_notes: true
          # github.ref_name is the branch name on workflow_dispatch, so a bare
          # `github.ref_name || ...` fallback never fires and tags the release
          # after the branch. Only trust ref_name when the ref really is a tag.
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', needs.build-apple.outputs.faust_version) }}
